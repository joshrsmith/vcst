name: Release

# A tag like v0.1.0 or v0.2.0rc1 on a commit of main publishes a GitHub release of it, with the files built from it.
# Tags are made by hand, see RELEASING.md.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

# Releases happen one at a time, and a release already going isn't cancelled by another tag
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # All branches and tags, to find out whether the commit is on main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::The tag $TAG isn't a version like v0.1.0, v0.1.0a1, v0.1.0b1 or v0.1.0rc1"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag $TAG isn't on a commit of main"
            exit 1
          fi

  build:
    name: Build
    needs: check
    uses: ./.github/workflows/build.yml

  test:
    name: Tests
    needs: check
    uses: ./.github/workflows/tests.yml

  release:
    name: GitHub release
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Creates the release and uploads its files
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # The version in the file names comes from the tag, so a mismatch means something is wrong with the build
      - name: Check the files
        run: |
          ls dist
          for file in dist/*; do
            case "$file" in
              *"-${TAG#v}"[-.]*) ;;
              *) echo "::error::$file doesn't have the version of the tag $TAG"; exit 1 ;;
            esac
          done

      # A version with a, b or rc in it is marked as a prerelease, which GitHub doesn't show as the latest release
      - name: Create the release
        run: |
          prerelease=()
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "$TAG" "${prerelease[@]}"
