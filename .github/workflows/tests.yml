name: Tests

on:
  # A branch with an open pull request is tested by pull_request only, as push would run the same jobs again
  push:
    branches: [main]
  pull_request:
  # Called by newest-versions.yml, with the versions of VUnit and cocotb to test instead of the supported ones, and by
  # release.yml without versions
  workflow_call:
    inputs:
      vunit:
        description: Space-separated versions of VUnit, empty for the supported ones
        type: string
        default: ""
      cocotb:
        description: Space-separated versions of cocotb, empty for the supported ones
        type: string
        default: ""
      newest-coverage:
        description: Check the old SQLite workaround with the newest coverage.py instead of the one pinned below
        type: boolean
        default: false

# A newer push to a pull request cancels the runs still going for it. The name is fixed, as github.workflow is the
# workflow calling this one, which has other jobs in the same group.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The combinations of VUnit and cocotb versions to test come from tests/run_matrix.py, which every test job runs
  matrix:
    name: Combinations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The versions are left unquoted to become one argument each
      - id: matrix
        env:
          VUNIT_VERSIONS: ${{ inputs.vunit }}
          COCOTB_VERSIONS: ${{ inputs.cocotb }}
        run: |
          # shellcheck disable=SC2086
          matrix=$(python3 tests/run_matrix.py --github-matrix ghdl nvc \
            ${VUNIT_VERSIONS:+--vunit $VUNIT_VERSIONS} ${COCOTB_VERSIONS:+--cocotb $COCOTB_VERSIONS})
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: VUnit ${{ matrix.vunit }}, cocotb ${{ matrix.cocotb }}, ${{ matrix.simulator }}
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      # The versions of the simulators and the SHA-256 of what is downloaded, which the download is checked against
      GHDL_VERSION: "6.0.0"
      GHDL_SHA256: "e0064cd3d1569e7fca27b186b0d71e80c087de90db4e466ed77dc669a574d8bc"
      NVC_VERSION: "1.23.1"
      NVC_SHA256: "836b86c93d7ac0fa6d6313b651c0409476f04f59718fb270515e6bc6232477cd"
      VUNIT_SIMULATOR: ${{ matrix.simulator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install GHDL
        if: matrix.simulator == 'ghdl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgnat-13 llvm-18 clang zlib1g-dev tcl
          curl -fsSL -o ghdl.tgz "https://github.com/ghdl/ghdl/releases/download/v${GHDL_VERSION}/ghdl-llvm-${GHDL_VERSION}-ubuntu24.04-x86_64.tar.gz"
          echo "${GHDL_SHA256}  ghdl.tgz" | sha256sum --check
          mkdir -p "$HOME/ghdl" && tar -xzf ghdl.tgz -C "$HOME/ghdl" --strip-components=1
          echo "$HOME/ghdl/bin" >> "$GITHUB_PATH"

      - name: Install NVC
        if: matrix.simulator == 'nvc'
        run: |
          curl -fsSL -o nvc.deb "https://github.com/nickg/nvc/releases/download/r${NVC_VERSION}/nvc_${NVC_VERSION}-1_amd64_ubuntu-24.04.deb"
          echo "${NVC_SHA256}  nvc.deb" | sha256sum --check
          sudo apt-get update
          sudo apt-get install -y ./nvc.deb tcl

      # Installs the versions in a virtual environment, whose Python is run without activating it, which VCST supports
      - name: Run tests
        env:
          VUNIT_VERSION: ${{ matrix.vunit }}
          COCOTB_VERSION: ${{ matrix.cocotb }}
        run: python tests/run_matrix.py --vunit "$VUNIT_VERSION" --cocotb "$COCOTB_VERSION" --output "$HOME/matrix" --show-logs

  # The workaround letting coverage.py save its data with the old SQLite which Riviera-PRO loads into the simulator
  # (vcst/utils/old_sqlite.py), checked without Riviera-PRO: SQLite 3.25.3, the version of Riviera-PRO 2026.04, is
  # built from source and loaded into Python. Pull requests use the coverage.py pinned here, so that a new coverage.py
  # doesn't fail unrelated changes; newest-versions.yml runs it every week with the newest coverage.py, so that one which
  # no longer works with that SQLite, despite the workaround, or which no longer needs it, is noticed.
  old-sqlite:
    name: Old SQLite, Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python whose sqlite3 has SQLITE_DBCONFIG_DEFENSIVE, and the newest that cocotb supports (cocotb
        # refuses to install on a newer one)
        python: ["3.12", "3.14"]
    env:
      COVERAGE: ${{ inputs.newest-coverage && 'coverage' || 'coverage==7.17.5' }}
      SQLITE_SOURCE: sqlite-amalgamation-3250300
      SQLITE_SHA256: "2ad5379f3b665b60599492cc8a13ac480ea6d819f91b1ef32ed0e1ad152fafef"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build SQLite 3.25.3
        run: |
          curl -fsSL -o sqlite.zip "https://www.sqlite.org/2018/${SQLITE_SOURCE}.zip"
          echo "${SQLITE_SHA256}  sqlite.zip" | sha256sum --check
          unzip -q sqlite.zip
          gcc -shared -fPIC -O2 -w -o "$HOME/libsqlite3.so.0" "${SQLITE_SOURCE}/sqlite3.c" -lpthread -ldl -lm

      # With VCST_OLD_SQLITE set, the test fails instead of being skipped if it can't use that SQLite
      - name: Check the workaround
        run: |
          python -m pip install . "$COVERAGE"
          VCST_OLD_SQLITE="$HOME/libsqlite3.so.0" python -m unittest discover -v -s tests/unit -p test_old_sqlite.py
