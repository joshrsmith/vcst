name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: VUnit ${{ matrix.vunit }}, cocotb ${{ matrix.cocotb }}, ${{ matrix.simulator }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        vunit: ["4.7.1", "5.0.0.dev16"]
        cocotb: ["1.8.1", "1.9.2"]
        simulator: [ghdl]
    env:
      GHDL_VERSION: "6.0.0"
      VUNIT_SIMULATOR: ${{ matrix.simulator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install GHDL
        if: matrix.simulator == 'ghdl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgnat-13 llvm-18 clang zlib1g-dev
          curl -fsSL -o ghdl.tgz "https://github.com/ghdl/ghdl/releases/download/v${GHDL_VERSION}/ghdl-llvm-${GHDL_VERSION}-ubuntu24.04-x86_64.tar.gz"
          mkdir -p "$HOME/ghdl" && tar -xzf ghdl.tgz -C "$HOME/ghdl" --strip-components=1
          echo "$HOME/ghdl/bin" >> "$GITHUB_PATH"

      # The virtual environment is used without activating it, which VCST supports
      - name: Install VCST
        run: |
          python -m venv "$HOME/venv"
          "$HOME/venv/bin/python" -m pip install --upgrade pip
          "$HOME/venv/bin/python" -m pip install "vunit-hdl==${{ matrix.vunit }}" "cocotb==${{ matrix.cocotb }}" .

      - name: Run tests
        run: |
          "$HOME/venv/bin/python" tests/vhdl/cocotb_examples/run.py -p 4 --clean
          "$HOME/venv/bin/python" tests/vhdl/vunit_and_cocotb/run.py -p 4 --clean
          "$HOME/venv/bin/python" tests/vhdl/parameterize_test/run.py -p 4 --clean
