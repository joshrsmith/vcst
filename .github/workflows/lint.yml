name: Lint

on:
  # A branch with an open pull request is checked by pull_request only, as push would run the same jobs again
  push:
    branches: [main]
  pull_request:

# A newer push to a branch or pull request cancels the runs still going for it, but runs on main finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-24.04
    env:
      # Pinned, so that a new release of ruff can't fail the checks of unrelated changes. The rules are in pyproject.toml.
      RUFF_VERSION: "0.17.6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Check formatting
        run: ruff format --check --diff .

      - name: Lint
        run: ruff check --output-format=github .
