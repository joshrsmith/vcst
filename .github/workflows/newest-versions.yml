name: Newest versions

# Runs the tests with the newest release and the newest prerelease of VUnit and of cocotb on PyPI, which can be newer than
# the versions VCST supports, so that a change in either that breaks VCST is found before a user finds it.
# A failed run opens an issue mentioning the repository owner, or comments on the one still open.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A run still going isn't cancelled by another, and only one waits
concurrency:
  group: newest-versions
  cancel-in-progress: false

jobs:
  versions:
    name: Newest versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      vunit: ${{ steps.versions.outputs.vunit }}
      cocotb: ${{ steps.versions.outputs.cocotb }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Asks pip which version it would install, once without and once with prereleases, and lists each version once
      - id: versions
        run: |
          newest() {
            for pre in "" "--pre"; do
              pip install --dry-run --quiet --ignore-installed --report - $pre "$1" |
                python3 -c 'import json, sys; print(json.load(sys.stdin)["install"][0]["metadata"]["version"])'
            done | sort -u | tr '\n' ' '
          }
          echo "vunit=$(newest vunit-hdl)" >> "$GITHUB_OUTPUT"
          echo "cocotb=$(newest cocotb)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: versions
    uses: ./.github/workflows/tests.yml
    with:
      vunit: ${{ needs.versions.outputs.vunit }}
      cocotb: ${{ needs.versions.outputs.cocotb }}

  # GitHub emails a failed scheduled run only to whoever last changed the schedule, so the owner is mentioned in an issue
  report:
    name: Report failure
    needs: [versions, test]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # Opens the issue, or comments on it
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      VUNIT: ${{ needs.versions.outputs.vunit }}
      COCOTB: ${{ needs.versions.outputs.cocotb }}
    steps:
      - name: Open an issue, or comment on the open one
        run: |
          title="Tests fail with the newest VUnit or cocotb"
          if [ -n "$VUNIT" ] && [ -n "$COCOTB" ]; then
            body="@${OWNER} The tests failed with VUnit ${VUNIT% } and cocotb ${COCOTB% }: ${RUN_URL}"
          else
            body="@${OWNER} The run failed before the tests, while looking up the newest versions: ${RUN_URL}"
          fi
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
