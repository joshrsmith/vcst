name: Newest versions

# Runs the tests with the newest release and the newest prerelease of VUnit and of cocotb on PyPI, which can be newer than
# the versions VCST supports, so that a change in either that breaks VCST is found before a user finds it.
# A failed scheduled run is reported by GitHub to whoever last changed the schedule below.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    name: Newest versions
    runs-on: ubuntu-24.04
    outputs:
      vunit: ${{ steps.versions.outputs.vunit }}
      cocotb: ${{ steps.versions.outputs.cocotb }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Asks pip which version it would install, once without and once with prereleases, and lists each version once
      - id: versions
        run: |
          newest() {
            for pre in "" "--pre"; do
              pip install --dry-run --quiet --ignore-installed --report - $pre "$1" |
                python3 -c 'import json, sys; print(json.load(sys.stdin)["install"][0]["metadata"]["version"])'
            done | sort -u | tr '\n' ' '
          }
          echo "vunit=$(newest vunit-hdl)" >> "$GITHUB_OUTPUT"
          echo "cocotb=$(newest cocotb)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: versions
    uses: ./.github/workflows/tests.yml
    with:
      vunit: ${{ needs.versions.outputs.vunit }}
      cocotb: ${{ needs.versions.outputs.cocotb }}
    permissions:
      contents: read
