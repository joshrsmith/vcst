version: 2
updates:
  # The actions in the workflows are pinned to commit SHAs, which Dependabot updates along with the version in the comment
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A release is proposed a week after it appears, so a compromised release is more likely to be pulled first
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
