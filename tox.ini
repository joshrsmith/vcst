[tox]
envlist = py3-vunit{47,5}-cocotb{18,19,20,21}

[testenv]
deps =
    vunit47: vunit-hdl==4.7.1
    vunit5: vunit-hdl==5.0.0.dev16
    cocotb18: cocotb~=1.8.0
    cocotb19: cocotb~=1.9.0
    cocotb20: cocotb~=2.0.0
    cocotb21: cocotb~=2.1.0

passenv =
	ALDEC_LICENSE_FILE
	LM_LICENSE_FILE
	VUNIT_SIMULATOR

commands =
    python tests/vhdl/cocotb_examples/run.py -p 10 --clean
    python tests/vhdl/vunit_and_cocotb/run.py -p 10 --clean
    python tests/vhdl/parameterize_test/run.py -p 10 --clean
