[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vcst"
version = "0.0.11"
description = "VUnit & cocotb smashed Together"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Price", email = "jpwice100@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["vunit-hdl>=4.7.1,<6", "cocotb>=1.8,<3"]

[tool.hatch.build.targets.wheel]
packages = ["vcst"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Errors and likely bugs (pycodestyle E4, E7 and E9, pyflakes), import sorting and bugbear
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately fail or compare without using the result, to check the outcomes VCST reports
"tests/**" = ["B009", "B010", "B011", "B015"]
# Attributes of the calling module are set by name
"vcst/utils/*" = ["B009", "B010"]
