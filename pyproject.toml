[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vcst"
version = "0.0.11"
description = "VUnit & cocotb smashed Together"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Price", email = "jpwice100@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["vunit-hdl>=4.7.1,<6", "cocotb>=1.8,<3"]

[tool.hatch.build.targets.wheel]
packages = ["vcst"]
