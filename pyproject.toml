[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vcst"
dynamic = ["version"]
description = "VUnit & cocotb smashed Together"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Price", email = "jpwice100@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["vunit-hdl>=4.7.1,<6", "cocotb>=1.8,<3"]

# The version is the latest tag, e.g. v0.1.0 is 0.1.0, and a commit after it is a development version of the next one.
# Without git metadata, e.g. a downloaded archive of the source, it is 0.0.0 instead of a failed install.
[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["vcst"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Errors and likely bugs (pycodestyle E4, E7 and E9, pyflakes), import sorting, bugbear, newer syntax (UP),
# simpler comprehensions (C4) and code (SIM), subprocess.run without check= and unused noqa comments
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4", "SIM", "PLW1510", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately fail or compare without using the result, to check the outcomes VCST reports
"tests/**" = ["B009", "B010", "B011", "B015"]
# Attributes of the calling module are set by name
"vcst/utils/*" = ["B009", "B010"]
